<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8c362a">
<title>诗词背诵 · 阅读与背诵</title>
<meta name="description" content="小学/初中古诗词阅读与背诵自测，支持阅读模式与遮挡背诵模式。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="诗词背诵">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/lxgwwenkaiscreen.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header" data-u32-name="header">
  <div class="header-inner" data-u32-name="header-inner">
    <h1 class="site-title" data-u32-name="site-title"><span class="seal" data-u32-name="seal" aria-hidden="true">诵</span>诗词背诵</h1>
    <div class="mode-switch" data-u32-name="mode-switch" role="tablist" aria-label="模式切换">
      <button class="mode-btn active" data-mode="read" role="tab" aria-selected="true" data-u32-name="mode-read">📖 阅读模式</button>
      <button class="mode-btn" data-mode="recite" role="tab" aria-selected="false" data-u32-name="mode-recite">✍️ 背诵模式</button>
    </div>
  </div>
</header>

<nav class="cat-tabs" data-u32-name="cat-tabs" role="tablist" aria-label="诗词分类">
  <button class="cat-btn active" data-cat="primary" data-u32-name="cat-primary">小学课本</button>
  <button class="cat-btn" data-cat="extra" data-u32-name="cat-extra">小学课外</button>
  <button class="cat-btn" data-cat="junior" data-u32-name="cat-junior">初中</button>
</nav>

<div class="toolbar" data-u32-name="toolbar">
  <div class="search-box" data-u32-name="search-box">
    <input type="search" id="searchInput" placeholder="搜索诗名 / 作者 / 诗句…" aria-label="搜索" data-u32-name="search-input">
  </div>
  <div class="chips" id="gradeChips" data-u32-name="grade-chips" role="group" aria-label="年级筛选"></div>
  <div class="filter-row" data-u32-name="filter-row">
    <label class="check" data-u32-name="filter-must"><input type="checkbox" id="mustOnly"> 仅看必背</label>
    <label class="check" data-u32-name="filter-mem"><input type="checkbox" id="memOnly"> 仅看未背</label>
    <span class="spacer" data-u32-name="filter-spacer"></span>
    <span class="count" id="countLabel" data-u32-name="count-label"></span>
  </div>
</div>

<main class="poem-list" id="poemList" data-u32-name="poem-list" aria-live="polite"></main>

<div class="lightbox" id="lightbox" data-u32-name="lightbox" hidden>
  <button class="lightbox-close" id="lightboxClose" aria-label="关闭" data-u32-name="lightbox-close">×</button>
  <img id="lightboxImg" alt="速记配图放大" data-u32-name="lightbox-img">
</div>

<footer class="app-footer" data-u32-name="footer">
  <span data-u32-name="footer-text">共 <b id="totalCount">0</b> 首 · 数据来源「古诗库-诗词大赛.xls」</span><br>
  <span data-u32-name="footer-tip">📖 阅读模式：点击生字可看拼音</span>
</footer>

<script src="app.js"></script>
</body>
</html>
