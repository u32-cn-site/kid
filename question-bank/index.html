<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新概念英语题库 - U32练习场</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { background: white; border-radius: 16px; padding: 40px; margin-bottom: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
    .header h1 { font-size: 2.5rem; color: #1a202c; margin-bottom: 12px; }
    .header p { color: #718096; font-size: 1.1rem; }
    .stats { display: flex; justify-content: center; gap: 40px; margin-top: 24px; }
    .stat-item { text-align: center; }
    .stat-value { font-size: 2rem; font-weight: bold; color: #667eea; }
    .stat-label { color: #718096; font-size: 0.9rem; margin-top: 4px; }
    .category { background: white; border-radius: 16px; padding: 32px; margin-bottom: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .category-header { display: flex; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid #f7fafc; }
    .category-icon { width: 48px; height: 48px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 16px; }
    .category-icon span { color: white; font-size: 1.5rem; font-weight: bold; }
    .category-info h2 { font-size: 1.5rem; color: #1a202c; margin-bottom: 4px; }
    .category-info p { color: #718096; font-size: 0.95rem; }
    .series-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .series-card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; transition: all 0.3s ease; }
    .series-card:hover { border-color: #667eea; box-shadow: 0 4px 12px rgba(102,126,234,0.15); }
    .series-title { font-size: 1.1rem; font-weight: 600; color: #2d3748; margin-bottom: 8px; }
    .series-desc { color: #718096; font-size: 0.9rem; margin-bottom: 16px; line-height: 1.5; }
    .exam-list { display: flex; flex-direction: column; gap: 12px; }
    .exam-item { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: #f7fafc; border-radius: 8px; transition: all 0.2s ease; text-decoration: none; color: inherit; }
    .exam-item:hover { background: #edf2f7; transform: translateX(4px); }
    .exam-info { flex: 1; }
    .exam-title { font-weight: 600; color: #2d3748; margin-bottom: 4px; }
    .exam-meta { display: flex; gap: 16px; font-size: 0.85rem; color: #718096; }
    .exam-meta-item { display: flex; align-items: center; gap: 4px; }
    .exam-action { color: #667eea; font-weight: 600; font-size: 0.9rem; }
    .badge { display: inline-block; padding: 4px 8px; background: #667eea; color: white; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .empty-state { text-align: center; padding: 60px 20px; color: #718096; }
    .empty-state-icon { font-size: 3rem; margin-bottom: 16px; }
    .footer { text-align: center; color: rgba(255,255,255,0.8); margin-top: 40px; font-size: 0.9rem; }
    @media (max-width: 768px) {
      .header h1 { font-size: 1.8rem; }
      .stats { gap: 20px; flex-wrap: wrap; }
      .series-grid { grid-template-columns: 1fr; }
      .exam-item { flex-direction: column; align-items: flex-start; gap: 12px; }
      .exam-action { align-self: flex-end; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📚 新概念英语题库</h1>
      <p>U32练习场 - 新概念英语完美演练题集</p>
      <div class="stats">
        <div class="stat-item">
          <div class="stat-value" id="totalExams">0</div>
          <div class="stat-label">题集</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="totalQuestions">0</div>
          <div class="stat-label">题目</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="totalPoints">0</div>
          <div class="stat-label">总分</div>
        </div>
      </div>
    </div>

    <div id="content"></div>

    <div class="footer">
      <p>© 2024 U32.cn - 新概念英语题库</p>
    </div>
  </div>

  <script>
    const BASE_PATH = 'https://kid.u32.cn/question-bank/bank/';

    fetch('./list.json')
      .then(res => res.json())
      .then(data => {
        renderContent(data);
      })
      .catch(err => {
        console.error('加载题库数据失败:', err);
        document.getElementById('content').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><p>题库数据加载失败，请稍后重试</p></div>';
      });

    function renderContent(data) {
      const content = document.getElementById('content');
      let totalExams = 0;
      let totalQuestions = 0;
      let totalPoints = 0;

      const html = data.categories.map(category => {
        const seriesHtml = category.series.map(series => {
          const examsHtml = series.exams.map(exam => {
            totalExams++;
            totalQuestions += exam.totalQuestions;
            totalPoints += exam.totalPoints;

            return `
              <a href="${BASE_PATH}${series.path}${exam.file}" class="exam-item" target="_blank">
                <div class="exam-info">
                  <div class="exam-title">${exam.title}</div>
                  <div class="exam-meta">
                    <span class="exam-meta-item">📝 ${exam.totalQuestions}题</span>
                    <span class="exam-meta-item">⭐ ${exam.totalPoints}分</span>
                    <span class="exam-meta-item">⏱️ ${exam.duration}</span>
                  </div>
                </div>
                <div class="exam-action">开始练习 →</div>
              </a>
            `;
          }).join('');

          return `
            <div class="series-card">
              <div class="series-title">${series.name}</div>
              <div class="series-desc">${series.description}</div>
              <div class="exam-list">${examsHtml}</div>
            </div>
          `;
        }).join('');

        return `
          <div class="category">
            <div class="category-header">
              <div class="category-icon"><span>${category.id.substring(0,2).toUpperCase()}</span></div>
              <div class="category-info">
                <h2>${category.name}</h2>
                <p>${category.description}</p>
              </div>
            </div>
            <div class="series-grid">${seriesHtml}</div>
          </div>
        `;
      }).join('');

      content.innerHTML = html;

      // 更新统计
      document.getElementById('totalExams').textContent = totalExams;
      document.getElementById('totalQuestions').textContent = totalQuestions;
      document.getElementById('totalPoints').textContent = totalPoints;
    }
  </script>
</body>
</html>
